spring:
  application:
    name: railway-booking

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:55432/railway_booking}
    username: ${SPRING_DATASOURCE_USERNAME:railway_app}
    password: ${SPRING_DATASOURCE_PASSWORD:change_me}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

app:
  jwt:
    secret-base64: ${JWT_SECRET_BASE64}
    issuer: ${JWT_ISSUER:railway-booking}
    access-minutes: ${ACCESS_TOKEN_MINUTES:15}
    refresh-days: ${REFRESH_TOKEN_DAYS:14}
  bootstrap:
    email: ${BOOTSTRAP_ADMIN_EMAIL}
    name: ${BOOTSTRAP_ADMIN_NAME:System Administrator}
    password: ${BOOTSTRAP_ADMIN_PASSWORD}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8080}
  security:
    cookie-secure: ${COOKIE_SECURE:false}
    permanent-delete-enabled: ${PERMANENT_DELETE_ENABLED:false}
    max-failed-login-attempts: 5
    lock-minutes: 15